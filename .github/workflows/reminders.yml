name: Send assignment reminders

# StudyFlow is a static site talking straight to Firestore, so nothing of ours is
# awake to send a push when the browser is closed. This workflow is that missing
# piece: it wakes up on a schedule, asks Firestore which reminders are due, and
# sends them. See notifier/send-reminders.js.
on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled runs on a best-effort basis and
    # can be several minutes late under load, which is why the sender treats a
    # late reminder as still worth delivering rather than dropping it.
    - cron: '*/15 * * * *'
    # In practice GitHub has fired this ~6 times a day, not 96, which is why a
    # run no longer scans once and exits but stays up watching (WATCH_MINUTES).
  workflow_dispatch:
    inputs:
      mode:
        description: 'reminders = normal run, test = push "Notifications are working!" to every subscribed device'
        type: choice
        options: [reminders, test]
        default: reminders
      dry_run:
        description: 'Log what would be sent without sending anything or writing to Firestore'
        type: boolean
        default: false

# Never let two runs overlap — two senders at once could both decide the same
# assignment is due and send it twice. Each run now watches for hours (see
# WATCH_MINUTES), so the next scheduled run waits here and takes over the moment
# this one exits. GitHub keeps only the newest waiting run, so older waiting
# runs show up as "cancelled" in the Actions tab; that's expected.
concurrency:
  group: studyflow-reminders
  cancel-in-progress: false

permissions:
  contents: read
  # Only for the keep-alive step below, which re-enables this workflow.
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    # GitHub's hard cap for a job is 360; WATCH_MINUTES leaves room for setup.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      # GitHub disables scheduled workflows in a public repo after 60 days
      # with no repository activity, and does it silently — reminders would
      # just stop. Re-enabling the workflow through the API counts as activity
      # and resets that clock, so every run keeps the next ones alive without
      # needing dummy commits. It runs first because the send step below stays
      # up for hours, and it can't fail the job: a hiccup here must never cost
      # a round of reminders.
      - name: Keep scheduled runs from being auto-disabled
        continue-on-error: true
        run: gh workflow enable reminders.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO:  ${{ github.repository }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: notifier/package-lock.json

      - run: npm ci
        working-directory: notifier

      - run: node send-reminders.js
        working-directory: notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_EMAIL:              ${{ secrets.VAPID_EMAIL }}
          VAPID_PUBLIC_KEY:         ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:        ${{ secrets.VAPID_PRIVATE_KEY }}
          MODE:                     ${{ inputs.mode }}
          DRY_RUN:                  ${{ inputs.dry_run }}
          # How stale a reminder may be and still be worth sending once its
          # deadline has passed. Past this it is marked as reminded without a
          # push, so the first run after an outage doesn't deliver a backlog.
          MAX_LATE_MINUTES:         '360'
          # Stay up checking every 30s for this long rather than scanning once.
          # Test and dry runs ignore it and exit after a single pass.
          WATCH_MINUTES:            '345'
          # Only used for assignments saved before the client stored deadlineMs;
          # those carry a wall-clock time with no timezone attached.
          DEFAULT_TIMEZONE:         'America/Los_Angeles'
